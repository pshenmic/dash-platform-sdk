    ResponseMetadata metadata = 3;
  }
  message GetIdentityByNonUniquePublicKeyHashResponseV1 {
    message IdentityResponse { optional bytes identity = 1; }

    oneof result {
      IdentityResponse identity = 1;
      Proof proof = 2;
    }

    ResponseMetadata metadata = 3;
  }
  oneof version {
