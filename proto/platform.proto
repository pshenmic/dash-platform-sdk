message ContractModerationDocument {
  string document_type_name = 1;
  bytes document_id = 2;
}

message ContractModerationReason {
  optional uint32 code =
      1;
  string text = 2;
  repeated ContractModerationDocument documents =
      3;
  optional bytes reason_document_id =
      4;
}

message GetContractDocumentRemovalsResponse {
  message ContractDocumentRestoration {
    bytes moderator_id =
        1;
    uint64 restored_at =
        2;
  }

  message ContractDocumentRemoval {
    bytes document_id = 1;
    bytes document_owner_id = 2;
    bytes moderator_id = 3;
    uint64 removed_at =
        4;
    ContractModerationReason reason = 5;
    bytes document_hash =
        6;
    ContractDocumentRestoration restoration =
        7;
    bytes kept_fields =
        8;
  }

  message ContractDocumentRemovals {
    repeated ContractDocumentRemoval removals =
        1;
  }

  message GetContractDocumentRemovalsResponseV0 {
    oneof result {
      ContractDocumentRemovals removals = 1;
      Proof proof = 2;
    }
    ResponseMetadata metadata = 3;
  }
  oneof version { GetContractDocumentRemovalsResponseV0 v0 = 1; }
}

message GetDocumentsRequest {
  enum WhereOperator {
    EQUAL = 0;
    GREATER_THAN = 1;
    GREATER_THAN_OR_EQUALS = 2;
    LESS_THAN = 3;
    LESS_THAN_OR_EQUALS = 4;
    BETWEEN = 5;
    BETWEEN_EXCLUDE_BOUNDS = 6;
    BETWEEN_EXCLUDE_LEFT = 7;
    BETWEEN_EXCLUDE_RIGHT = 8;
    IN = 9;
    STARTS_WITH = 10;
    IN_TIME_RANGE = 11;
    IN_INTEGER_RANGE = 12;
    CONTAINS = 13;
    CONTAINS_ANY = 14;
  }

  message DocumentFieldValue {
    message ValueList { repeated DocumentFieldValue values = 1; }

    oneof variant {
      bool bool_value = 1;
      sint64 int64_value = 2 [jstype = JS_STRING];
      uint64 uint64_value = 3 [jstype = JS_STRING];
      double double_value = 4;
      string text = 5;
      bytes bytes_value = 6;
      ValueList list = 7;
      bool null_value = 8;
    }
  }

  message TimeRangeSelection {
    enum Selector {
      NEWEST = 0;
      OLDEST = 1;
      BY_START = 2;
    }
    message Grid {
      uint64 range = 1 [jstype = JS_STRING];
      uint64 step = 2 [jstype = JS_STRING];
      uint64 phase = 3 [jstype = JS_STRING];
    }
    Selector selector = 1;
    optional uint64 start_ms = 2 [jstype = JS_STRING];
    Grid grid = 3;
  }

  message IntegerRangeSelection {
    message Grid {
      uint64 range = 1 [jstype = JS_STRING];
      uint64 step = 2 [jstype = JS_STRING];
      uint64 phase = 3 [jstype = JS_STRING];
    }
    DocumentFieldValue start = 1;
    Grid grid = 2;
  }

  message WhereClause {
    string field = 1;
    WhereOperator operator = 2;
    DocumentFieldValue value = 3;
    TimeRangeSelection time_range = 4;
    IntegerRangeSelection integer_range = 5;
  }

  message HavingAggregate {
    enum Function {
      COUNT = 0;
      SUM = 1;
      AVG = 2;
    }
    Function function = 1;
    string field = 2;
  }

  message HavingClause {
    enum Operator {
      EQUAL = 0;
      NOT_EQUAL = 1;
      GREATER_THAN = 2;
      GREATER_THAN_OR_EQUALS = 3;
      LESS_THAN = 4;
      LESS_THAN_OR_EQUALS = 5;
      BETWEEN = 6;
      BETWEEN_EXCLUDE_BOUNDS = 7;
      BETWEEN_EXCLUDE_LEFT = 8;
      BETWEEN_EXCLUDE_RIGHT = 9;
      IN = 10;
    }
    HavingAggregate aggregate = 1;
    Operator operator = 2;
    oneof right {
      DocumentFieldValue value = 3;
    }
  }

  message OrderClause {
    oneof target {
      string field = 1;
      HavingAggregate aggregate = 3;
    }
    bool ascending = 2;
  }

  message GetDocumentsRequestV0 {
    bytes data_contract_id =
        1;
    string document_type = 2;
    bytes where = 3;
    bytes order_by = 4;
    uint32 limit = 5;

    oneof start {
      bytes start_after = 6;
      bytes start_at = 7;
    }
    bool prove = 8;
  }

  message GetDocumentsRequestV1 {
    message Select {
      enum Function {
        DOCUMENTS = 0;
        COUNT = 1;
        SUM = 2;
        AVG = 3;
        MIN = 4;
        MAX = 5;
      }
      Function function = 1;
      string field = 2;
    }

    bytes data_contract_id = 1;
    string document_type = 2;
    repeated WhereClause where_clauses = 3;
    repeated OrderClause order_by = 4;
    optional uint32 limit = 5;

    oneof start {
      bytes start_after = 6;
      bytes start_at = 7;
    }

    bool prove = 8;

    repeated Select selects = 9;

    repeated string group_by = 10;

    repeated HavingClause having = 11;

    optional uint32 offset = 12;

    message ChainedJoin {
      string join_property = 1;
      string outer_document_type = 2;
    }
    ChainedJoin chained = 13;

    message SubQuery {
      bytes data_contract_id = 1;
      string document_type = 2;
      repeated WhereClause where_clauses = 3;
      repeated OrderClause order_by = 4;
      optional uint32 limit = 5;
      enum Kind {
        DOCUMENTS = 0;
        COUNT = 1;
      }
      Kind kind = 6;
      message Binding {
        uint32 source = 1;
        string source_property = 2;
        string field = 3;
      }
      Binding bind = 7;
    }
    repeated SubQuery sub_queries = 14;
  }

  oneof version {
    GetDocumentsRequestV0 v0 = 1;
    GetDocumentsRequestV1 v1 = 2;
  }
}

message GetDocumentsResponse {
  message GetDocumentsResponseV0 {
    message Documents {
      repeated bytes documents = 1;
    }

    oneof result {
      Documents documents = 1;
      Proof proof = 2;
    }
    ResponseMetadata metadata = 3;
  }

  message GetDocumentsResponseV1 {
    message Documents {
      repeated bytes documents = 1;
    }

    message CountEntry {
      optional bytes in_key = 1;
      bytes key = 2;
      uint64 count = 3 [jstype = JS_STRING];
    }

    message CountEntries {
      repeated CountEntry entries = 1;
    }

    message CountResults {
      oneof variant {
        uint64 aggregate_count = 1 [jstype = JS_STRING];
        CountEntries entries = 2;
      }
    }

    message SumEntry {
      optional bytes in_key = 1;
      bytes key = 2;
      sint64 sum = 3 [jstype = JS_STRING];
    }

    message SumEntries {
      repeated SumEntry entries = 1;
    }

    message SumResults {
      oneof variant {
        sint64 aggregate_sum = 1 [jstype = JS_STRING];
        SumEntries entries = 2;
      }
    }

    message AverageEntry {
      optional bytes in_key = 1;
      bytes key = 2;
      uint64 count = 3 [jstype = JS_STRING];
      sint64 sum = 4 [jstype = JS_STRING];
    }

    message AverageEntries {
      repeated AverageEntry entries = 1;
    }

    message AverageAggregate {
      uint64 count = 1 [jstype = JS_STRING];
      sint64 sum = 2 [jstype = JS_STRING];
    }

    message AverageResults {
      oneof variant {
        AverageAggregate aggregate_average = 1;
        AverageEntries entries = 2;
      }
    }

    message RankedEntry {
      bytes key = 1;
      oneof value {
        uint64 count = 2 [jstype = JS_STRING];
        sint64 sum = 3 [jstype = JS_STRING];
        double avg = 4;
      }
      optional bytes in_key = 5;
    }

    message RankedEntries {
      repeated RankedEntry entries = 1;

      optional uint64 skipped = 2 [jstype = JS_STRING];
    }

    message ResultData {
      oneof variant {
        Documents documents = 1;
        CountResults counts = 2;
        SumResults sums = 3;
        AverageResults averages = 4;
        RankedEntries ranked = 5;
        ChainedDocuments chained = 6;
        CompositeDocuments composite = 7;
      }
    }

    message ChainedDocuments {
      repeated bytes inner_documents = 1;
      repeated bytes outer_documents = 2;
      repeated bytes missing_outer_ids = 3;
      repeated GetContractDocumentRemovalsResponse.ContractDocumentRemoval
          removed_outer_documents = 4;
    }

    message CompositeDocuments {
      repeated bytes page_documents = 1;
      message SubQueryResult {
        oneof result {
          Documents documents = 1;
          CountEntries counts = 2;
        }
        repeated bytes missing_ids = 3;
        repeated GetContractDocumentRemovalsResponse.ContractDocumentRemoval
            removed = 4;
      }
      repeated SubQueryResult sub_results = 2;
    }

    oneof result {
      ResultData data = 1;
      Proof proof = 2;
    }
    ResponseMetadata metadata = 3;
  }

  oneof version {
    GetDocumentsResponseV0 v0 = 1;
    GetDocumentsResponseV1 v1 = 2;
  }
}

