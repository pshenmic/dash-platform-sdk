syntax = "proto3";
import "google/protobuf/wrappers.proto";

package org.dash.platform.dapi.v0;


service Platform {
  rpc broadcastStateTransition(BroadcastStateTransitionRequest)
      returns (BroadcastStateTransitionResponse);
  rpc getIdentity(GetIdentityRequest)
      returns (GetIdentityResponse);
  rpc getIdentityKeys(GetIdentityKeysRequest)
      returns (GetIdentityKeysResponse);
  rpc getIdentityNonce(GetIdentityNonceRequest)
      returns (GetIdentityNonceResponse);
  rpc getIdentityContractNonce(GetIdentityContractNonceRequest)
      returns (GetIdentityContractNonceResponse);
  rpc getIdentityBalance(GetIdentityBalanceRequest)
      returns (GetIdentityBalanceResponse);
  rpc getDataContract(GetDataContractRequest)
      returns (GetDataContractResponse);
  rpc getDocuments(GetDocumentsRequest)
      returns (GetDocumentsResponse);
  rpc getIdentityByPublicKeyHash(GetIdentityByPublicKeyHashRequest)
      returns (GetIdentityByPublicKeyHashResponse);
  rpc getIdentityByNonUniquePublicKeyHash(GetIdentityByNonUniquePublicKeyHashRequest)
      returns (GetIdentityByNonUniquePublicKeyHashResponse);
  rpc waitForStateTransitionResult(WaitForStateTransitionResultRequest)
      returns (WaitForStateTransitionResultResponse);
  rpc getEpochsInfo(GetEpochsInfoRequest)
      returns (GetEpochsInfoResponse);
  rpc getFinalizedEpochInfos(GetFinalizedEpochInfosRequest)
      returns (GetFinalizedEpochInfosResponse);
  rpc getContestedResourceVoteState(GetContestedResourceVoteStateRequest)
      returns (GetContestedResourceVoteStateResponse);
  rpc getTotalCreditsInPlatform(GetTotalCreditsInPlatformRequest)
      returns (GetTotalCreditsInPlatformResponse);
  rpc getStatus(GetStatusRequest)
      returns (GetStatusResponse);
  rpc getCurrentQuorumsInfo(GetCurrentQuorumsInfoRequest)
      returns (GetCurrentQuorumsInfoResponse);
  rpc getIdentityTokenBalances(GetIdentityTokenBalancesRequest)
      returns (GetIdentityTokenBalancesResponse);
  rpc getIdentitiesTokenBalances(GetIdentitiesTokenBalancesRequest)
      returns (GetIdentitiesTokenBalancesResponse);
  rpc getTokenDirectPurchasePrices(GetTokenDirectPurchasePricesRequest)
      returns (GetTokenDirectPurchasePricesResponse);
  rpc getTokenContractInfo(GetTokenContractInfoRequest)
      returns (GetTokenContractInfoResponse);
  rpc getTokenTotalSupply(GetTokenTotalSupplyRequest)
      returns (GetTokenTotalSupplyResponse);
  rpc getAddressInfo(GetAddressInfoRequest)
      returns (GetAddressInfoResponse);
  rpc getAddressesInfos(GetAddressesInfosRequest)
      returns (GetAddressesInfosResponse);
  rpc getAddressesTrunkState(GetAddressesTrunkStateRequest)
      returns (GetAddressesTrunkStateResponse);
  rpc getAddressesBranchState(GetAddressesBranchStateRequest)
      returns (GetAddressesBranchStateResponse);
  rpc getRecentAddressBalanceChanges(GetRecentAddressBalanceChangesRequest)
      returns (GetRecentAddressBalanceChangesResponse);
  rpc getRecentCompactedAddressBalanceChanges(GetRecentCompactedAddressBalanceChangesRequest)
      returns (GetRecentCompactedAddressBalanceChangesResponse);
  rpc getShieldedEncryptedNotes(GetShieldedEncryptedNotesRequest)
      returns (GetShieldedEncryptedNotesResponse);
  rpc getShieldedAnchors(GetShieldedAnchorsRequest)
      returns (GetShieldedAnchorsResponse);
  rpc getMostRecentShieldedAnchor(GetMostRecentShieldedAnchorRequest)
      returns (GetMostRecentShieldedAnchorResponse);
  rpc getShieldedPoolState(GetShieldedPoolStateRequest)
      returns (GetShieldedPoolStateResponse);
  rpc getShieldedNotesCount(GetShieldedNotesCountRequest)
      returns (GetShieldedNotesCountResponse);
  rpc getShieldedNullifiers(GetShieldedNullifiersRequest)
      returns (GetShieldedNullifiersResponse);
}

message Proof {
  bytes grovedb_proof = 1;
  bytes quorum_hash = 2;
  bytes signature = 3;
  uint32 round = 4;
  bytes block_id_hash = 5;
  uint32 quorum_type = 6;
}

message ResponseMetadata {
  uint64 height = 1 [ jstype = JS_STRING ];
  uint32 core_chain_locked_height = 2;
  uint32 epoch = 3;
  uint64 time_ms = 4 [ jstype = JS_STRING ];
  uint32 protocol_version = 5;
  string chain_id = 6;
}

message StateTransitionBroadcastError {
  uint32 code = 1;
  string message = 2;
  bytes data = 3;
}

message BroadcastStateTransitionRequest { bytes state_transition = 1; }

message BroadcastStateTransitionResponse {}

message GetIdentityRequest {

